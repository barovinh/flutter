<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Outer circle (half filled to suggest progress) -->
  <circle cx="12" cy="12" r="10" stroke="#6C63FF" stroke-width="2"/>
  <!-- Progress arc - half circle filled -->
  <path d="M12 2 A10 10 0 0 1 12 22" fill="#6C63FF" opacity="0.25"/>
  <!-- Inner spinning arrow segments -->
  <path d="M12 7 L12 12 L16 12" stroke="#6C63FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small arrow tip at top -->
  <path d="M9 5 L12 2 L15 5" stroke="#6C63FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
